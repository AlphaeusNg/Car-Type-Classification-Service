name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Workflow policy
        run: python -m pytest -q tests/test_workflow.py
      - name: API and runner tests
        run: python -m pytest -q -W error
      - name: Dependency consistency
        run: python -m pip check
      - name: Python syntax
        run: python -m compileall -q api tests run.py prediction_example.py
